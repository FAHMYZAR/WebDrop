<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebDrop - 404</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#f4f4f4 0,#ffffff 100%);color:#161616;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:720px;width:100%;background:#fff;border:1px solid #e0e0e0;box-shadow:0 20px 60px rgba(22,22,22,.08);padding:0;overflow:hidden}
.hero{padding:28px 32px 20px;border-bottom:1px solid #e0e0e0;background:linear-gradient(135deg,rgba(15,98,254,.08),rgba(15,98,254,.02))}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#0f62fe;font-weight:700}
.window-dots{display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.window-dot{width:8px;height:8px;border-radius:999px;display:inline-block;opacity:.92}
.window-dot.red{background:#ff5f57}
.window-dot.yellow{background:#febc2e}
.window-dot.green{background:#28c840}
h1{margin:14px 0 10px;font-size:36px;line-height:1.05;letter-spacing:-.04em}
.lead{margin:0;color:#525252;line-height:1.7;max-width:56ch}
.body{padding:24px 32px 32px}
.panel{border:1px solid #e0e0e0;background:#f8f8f8;padding:18px 20px}
.panel-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#525252;font-weight:700;margin:0 0 8px}
.panel-code{margin:0;font-family:"Courier New",monospace;font-size:14px;line-height:1.7;color:#161616}
.meta{margin-top:18px;font-size:13px;color:#525252;line-height:1.6}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div class="kicker"><span class="window-dots" aria-hidden="true"><span class="window-dot red"></span><span class="window-dot yellow"></span><span class="window-dot green"></span></span><span>WebDrop</span></div>
<h1>OOPS, halaman tidak ditemukan</h1>
<p class="lead">Halaman yang kamu cari tidak tersedia, sudah dipindah, atau URL mengandung typo.</p>
</section>
<section class="body">
<div class="panel">
<p class="panel-title">Status</p>
<p class="panel-code">404 Not Found</p>
</div>
<p class="meta">Coba cek ulang alamat, query, atau kembali ke halaman sebelumnya.</p>
</section>
</main>
</body>
</html>
